<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Team - TaskManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container">
    <div class="form-card card">
        <h2 style="margin-bottom:1.5rem;">👥 Create New Team</h2>
        <form method="post" th:action="@{/teams/create}">
            <div class="form-group">
                <label>Team Name</label>
                <input type="text" name="name" placeholder="e.g. Backend Team" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="What does this team do?"></textarea>
            </div>
            <div class="form-group">
                <label>Manager</label>
                <select name="managerId">
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:text="${u.fullName + ' (' + u.role + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Members (hold Ctrl/Cmd to select multiple)</label>
                <select name="memberIds" multiple>
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:text="${u.fullName + ' (' + u.role + ')'}"></option>
                </select>
            </div>
            <div style="display:flex;gap:1rem;">
                <button type="submit" class="btn btn-primary">Create Team</button>
                <a th:href="@{/teams}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
