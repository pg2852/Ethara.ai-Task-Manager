<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - TaskManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>🛡️ Manage Users <span class="badge badge-admin">ADMIN ONLY</span></h1>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Username</th><th>Role</th><th>Change Role</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.username}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'badge-admin' : (${u.role.name() == 'MANAGER'} ? 'badge-manager' : 'badge-member')"
                              th:text="${u.role}"></span>
                    </td>
                    <td>
                        <form method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}" class="role-select-form">
                            <select name="role">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                        th:selected="${r == u.role}"></option>
                            </select>
                            <button type="submit" class="btn btn-secondary btn-sm">Save</button>
                        </form>
                    </td>
                    <td>
                        <a th:href="@{/admin/users/{id}/delete(id=${u.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this user?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
