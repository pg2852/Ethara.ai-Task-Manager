<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tasks - TaskManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>📋 Tasks</h1>
        <a th:href="@{/tasks/create}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','MANAGER')">+ New Task</a>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Assigned To</th>
                    <th>Team</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="7" style="text-align:center;color:#aaa;padding:2rem;">No tasks found</td>
                </tr>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.title}"></td>
                    <td th:text="${task.assignedTo?.fullName ?: '-'}"></td>
                    <td th:text="${task.team?.name ?: '-'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${task.priority.name() == 'HIGH'} ? 'badge-high' : (${task.priority.name() == 'MEDIUM'} ? 'badge-medium' : 'badge-low')"
                              th:text="${task.priority}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${task.status.name() == 'TODO'} ? 'badge-todo' : (${task.status.name() == 'IN_PROGRESS'} ? 'badge-progress' : 'badge-done')"
                              th:text="${task.status}"></span>
                    </td>
                    <td th:text="${task.dueDate}"></td>
                    <td>
                        <!-- Status quick update -->
                        <a th:if="${task.status.name() != 'IN_PROGRESS'}"
                           th:href="@{/tasks/{id}/status(id=${task.id},status='IN_PROGRESS')}"
                           class="btn btn-secondary btn-sm">▶ Start</a>
                        <a th:if="${task.status.name() != 'DONE'}"
                           th:href="@{/tasks/{id}/status(id=${task.id},status='DONE')}"
                           class="btn btn-primary btn-sm">✓ Done</a>
                        <a th:href="@{/tasks/{id}/delete(id=${task.id})}"
                           class="btn btn-danger btn-sm"
                           sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                           onclick="return confirm('Delete this task?')">✕</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
