<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - TaskManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">⚡ TaskManager</div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to your account</p>

        <div th:if="${param.error}" class="alert-error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert-success">You have been logged out.</div>
        <div th:if="${param.registered}" class="alert-success">Account created! Please login.</div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.7rem;">Login</button>
        </form>

        <p style="margin-top:1rem;font-size:0.85rem;text-align:center;">
            No account? <a th:href="@{/register}">Create one</a>
        </p>
    </div>
</div>
</body>
</html>
