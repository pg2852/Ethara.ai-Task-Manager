<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="navbar">
    <a class="brand" th:href="@{/dashboard}">⚡ TaskManager</a>
    <ul>
        <li><a th:href="@{/dashboard}">Dashboard</a></li>
        <li><a th:href="@{/tasks}">Tasks</a></li>
        <li><a th:href="@{/teams}">Teams</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/users}">Users</a></li>
        <li>
            <form method="post" th:action="@{/logout}" style="display:inline">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </li>
    </ul>
</nav>
</body>
</html>
